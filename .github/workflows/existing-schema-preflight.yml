name: Existing-install schema-only privacy preflight (NO LIVE DATA)
on:
  pull_request:
    paths:
      - 'compose.existing-schema-preflight.yml'
      - 'scripts/Inspect-ExistingSchema.ps1'
      - 'tests/release/existing-schema-report.sql'
      - 'tests/release/fixtures/existing-schema-structure-only.sql'
      - '.github/workflows/existing-schema-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-synthetic-schema-inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check and isolated Docker Compose configuration
        shell: bash
        run: |
          cp tests/release/fixtures/existing-schema-structure-only.sql /tmp/nonius-fixture.sql
          NONIUS_SCHEMA_SQL_PATH=/tmp/nonius-fixture.sql docker compose -f compose.existing-schema-preflight.yml config --quiet
      - name: Refuse a data-bearing SQL export before Docker starts
        shell: bash
        run: |
          cp tests/release/fixtures/existing-schema-structure-only.sql /tmp/nonius-with-data.sql
          printf "\nINSERT INTO schools(id,name,data) VALUES('id','sensitive','{}');\n" >> /tmp/nonius-with-data.sql
          if pwsh -NoProfile -File ./scripts/Inspect-ExistingSchema.ps1 -SchemaSqlPath /tmp/nonius-with-data.sql; then
            echo "FAIL: inspector accepted inserted records"
            exit 1
          fi
          echo "PASS: structure-only gate refused application data"
      - name: Import synthetic schema in isolated Docker and generate metadata-only report
        shell: bash
        run: |
          pwsh -NoProfile -File ./scripts/Inspect-ExistingSchema.ps1 -SchemaSqlPath /tmp/nonius-fixture.sql
      - name: Check schema metadata and private-data omissions
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('schema-preflight-results/existing-schema-report.json','utf8'));
          if (d.report_type !== 'SCHEMA_ONLY_NO_PRODUCTION_RECORDS' ||
              d.source_data_rows_inspected !== false || d.source_data_sanitized !== false ||
              d.production_approval !== 'PENDING') throw new Error('Unsafe or inaccurate report status');
          if (d.schema.tables.length !== 7 || d.schema.triggers.length !== 1 ||
              d.schema.foreign_keys.length !== 3) throw new Error('Missing structural metadata');
          if (d.schema.columns.length < 20) throw new Error('Column inventory was incomplete');
          const json = JSON.stringify(d);
          if (json.includes('offline-schema-root-only') || json.includes('offline-schema-probe-only')) {
              throw new Error('Test database credential leaked into report');
          }
          console.log('PASS: seven schema tables, one trigger, three FKs; zero application data');
          NODE
