name: Source syntax and calculation smoke
on:
  push:
  pull_request:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Lint PHP sources
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Calculation baseline smoke
        run: php tests/calculation-smoke.php
      - name: Security policy and SQL diagnostics
        run: |
          php tests/safety-smoke.php
          php tests/sql-guard-smoke.php
          php tests/source-policy.php
      - name: Check JS syntax
        run: node --check assets/app.js && node --check assets/login-slideshow.js && node --check tests/release/specs/full-release.spec.js && node --check tests/release/playwright.config.cjs
